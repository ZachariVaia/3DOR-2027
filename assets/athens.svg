<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img" aria-label="Line drawing of the Athens skyline with the Acropolis and Lycabettus hill">
  <title>Athens skyline</title>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- faint wireframe solid: a nod to 3D shape analysis -->
    <g stroke="#cfeef8" stroke-width="1.3">
      <path d="M978 44 1016 62v42l-38 18-38-18V62l38-18Z"/>
      <path d="M940 62 978 80l38-18M978 80v62"/>
      <path d="M940 104 978 80l38 24"/>
    </g>

    <!-- distant hills -->
    <g stroke="#b7e7f4" stroke-width="1.4">
      <path d="M0 214c46-26 84-40 126-40s78 16 116 40"/>
      <path d="M700 210c52-34 96-52 140-52s86 18 128 52"/>
    </g>

    <!-- left low-rise city blocks -->
    <g stroke="#22c1e8" stroke-width="1.8">
      <path d="M24 250v-46h58v46"/>
      <path d="M82 250v-64h44v64"/>
      <path d="M126 250v-34h52v34"/>
      <path d="M178 250v-56h40v56"/>
      <path d="M218 250v-28h56v28"/>
      <path d="M274 250v-48h38v48"/>
      <path d="M312 250v-36h46v36"/>
    </g>
    <g stroke="#b7e7f4" stroke-width="1.2">
      <path d="M40 216h12M62 216h8M96 200h14M96 222h14M140 232h12M158 232h10M190 210h16M232 236h14M252 236h10M286 218h14M326 230h18"/>
    </g>

    <!-- Acropolis rock -->
    <g stroke="#22c1e8" stroke-width="2">
      <path d="M368 250c22-14 36-34 44-58 6-18 22-28 46-30h190c26 2 42 12 48 32 8 24 22 42 44 56"/>
      <path d="M404 196c18-6 36-9 54-9M700 196c-16-6-33-9-50-9"/>
    </g>

    <!-- Parthenon -->
    <g stroke="#22c1e8" stroke-width="2">
      <!-- stylobate -->
      <path d="M452 162h206M458 154h194"/>
      <!-- columns -->
      <path d="M470 154v-40M494 154v-40M518 154v-40M542 154v-40M566 154v-40M590 154v-40M614 154v-40M638 154v-40"/>
      <!-- entablature -->
      <path d="M458 114h194M462 104h186"/>
      <!-- pediment -->
      <path d="M462 104 555 70l93 34"/>
    </g>

    <!-- right-hand blocks -->
    <g stroke="#22c1e8" stroke-width="1.8">
      <path d="M766 250v-40h44v40"/>
      <path d="M810 250v-58h38v58"/>
      <path d="M848 250v-30h50v30"/>
      <path d="M1074 250v-44h42v44"/>
      <path d="M1116 250v-32h60v32"/>
    </g>
    <g stroke="#b7e7f4" stroke-width="1.2">
      <path d="M782 222h14M824 208h12M824 228h12M864 236h20M1088 220h14M1132 234h26"/>
    </g>

    <!-- Lycabettus hill with chapel -->
    <g stroke="#22c1e8" stroke-width="2">
      <path d="M898 250c34-10 60-32 78-66 14-26 26-38 36-38s21 11 34 36c18 36 44 58 78 68"/>
      <path d="M1000 140h26v-18h-26zM1013 122v-12"/>
    </g>

    <!-- ground line -->
    <path d="M0 250h1200" stroke="#22c1e8" stroke-width="2"/>
    <path d="M0 264h330M380 264h250M700 264h500" stroke="#cfeef8" stroke-width="1.4"/>
  </g>
</svg>
